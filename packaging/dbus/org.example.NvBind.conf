<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <!-- разрешаем только чтение статуса всем -->
    <allow send_destination="org.example.NvBind"
           send_interface="org.example.NvBind"
           send_member="GetStatus"/>
    <!-- изменения состояния запрещаем по умолчанию (разрешим polkit-правилом) -->
    <deny  send_destination="org.example.NvBind" send_interface="org.example.NvBind" send_member="BindToNvidia"/>
    <deny  send_destination="org.example.NvBind" send_interface="org.example.NvBind" send_member="BindToVfio"/>
    <deny  send_destination="org.example.NvBind" send_interface="org.example.NvBind" send_member="Unbind"/>
  </policy>
</busconfig>
