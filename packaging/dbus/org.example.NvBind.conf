<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-Bus Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy user="root">
    <allow own="org.example.NvBind"/>
    <allow send_destination="org.example.NvBind"/>
  </policy>
  <policy context="default">
    <allow send_destination="org.example.NvBind"/>
    <allow send_destination="org.example.NvBind" send_interface="org.example.NvBind" send_member="get_status"/>
    <deny  send_destination="org.example.NvBind" send_interface="org.example.NvBind" send_member="bind_to_nvidia"/>
    <deny  send_destination="org.example.NvBind" send_interface="org.example.NvBind" send_member="bind_to_vfio"/>
    <deny  send_destination="org.example.NvBind" send_interface="org.example.NvBind" send_member="unbind"/>
  </policy>
</busconfig>
